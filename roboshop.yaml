- name: Create instances and Route 53 records
  hosts: localhost
  connection: local

  vars:
    instances: [mongodb, redis, mysql, rabbitmq, catalogue, user, cart, shipping, payment, dispatch, frontend]
    action: create
    domain_name: pari92s.online
    ami_id: ami-0055977a6e828a4f4

  tasks:
  - name: create ec2 instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ ami_id }}"
      instance_type: t3.micro
      security_groups:
      - roboshop-ssh
      - "roboshop-{{ item }}"
      region: us-east-1
      wait: true
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

  - name: create R53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ domain_name if item.item == 'frontend' else item.item + '.' + domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].public_ip_address if item.item == 'frontend' else item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: delete R53 records
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name if item == 'frontend' else item + '.' + domain_name }}"
      type: A
      ttl: 1
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete ec2 instances
    amazon.aws.ec2_instance:
      state: absent
      name: "roboshop-{{ item }}"
      region: us-east-1
      wait: false
    loop: "{{ instances }}"
    when: action == "delete"