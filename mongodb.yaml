- name: configure mongodb server
  hosts: mongodb
  become: yes

  tasks:
  - name: copy mongodb repo
    copy:
      src: mongodb.repo
      dest: /etc/yum.repos.d/mongodb.repo
 
  - name: install mongodb server
    package:
      name: mongodb-org
      state: present

  - name: start and enable mongodb
    service:
      name: mongod
      state: started
      enabled: yes

  - name: allow remote connections
    replace:
      path: /etc/mongod.conf
      regexp: '127.0.0.1'
      replace: '0.0.0.0'

  - name: restart mongod
    service:
      name: mongod
      state: restarted
    